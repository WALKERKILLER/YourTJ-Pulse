name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Install tippecanoe
        run: |
          git clone --depth 1 --branch 2.49.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          test "$(git -C /tmp/tippecanoe rev-parse HEAD)" = "021bb96aeb8b6bcbd93b5cdd309eaecd064d5a4c"
          make -C /tmp/tippecanoe -j2
          sudo make -C /tmp/tippecanoe install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify generated realtime contracts
        run: pnpm contracts:check

      - name: Verify Flutter integration architecture
        run: pnpm flutter:check

      - name: Analyze and test Flutter integration
        working-directory: apps/flutter
        run: flutter pub get --enforce-lockfile && flutter analyze && flutter test

      - name: Validate local D1 migrations
        run: pnpm --filter @yourtj/worker db:migrate:local && pnpm --filter @yourtj/worker db:check:local

      - name: Test
        run: pnpm test

      - name: Test Web user journeys
        run: pnpm e2e

      - name: Build
        run: pnpm build

      - name: Validate Web performance budgets
        run: pnpm performance:check

      - name: Verify generated data is current
        run: git diff --exit-code -- data/generated data/stable-id-map.json public/assets/data/custom.geojson tongji.pmtiles

      - name: Validate campus data
        run: pnpm data:validate
