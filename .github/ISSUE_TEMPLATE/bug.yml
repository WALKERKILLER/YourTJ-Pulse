name: Bug report
description: 报告可复现的缺陷
title: "fix: "
labels:
  - "type:bug"
  - "status:ready"
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 浏览器、系统、设备和相关版本；不要粘贴 Token、Cookie 或精确位置。
    validations:
      required: true
